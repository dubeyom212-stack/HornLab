<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}HornLab{% endblock %}</title>

    <meta
        name="description"
        content="HornLab — a focused practice workspace for musicians."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <a href="/" class="brand" aria-label="HornLab home">
            HORN<span>//</span>LAB
        </a>

        <nav class="main-nav" aria-label="Main navigation">

            <a
                href="/"
                class="{% if request.path == '/' %}active{% endif %}"
            >
                Today
            </a>

            <a href="/#library">
                Repertoire
            </a>

            <a href="/#stats">
                Progress
            </a>

            <a
                href="/about"
                class="{% if request.path == '/about' %}active{% endif %}"
            >
                About
            </a>

        </nav>

        {% if profile %}

        <div class="profile-menu">

            <button
                class="profile-button"
                type="button"
                aria-label="Open profile menu"
            >
                <span class="profile-avatar">
                    {{ profile.name[0]|upper }}
                </span>

                <span class="profile-name">
                    {{ profile.name }}
                </span>

                <svg
                    class="profile-chevron"
                    viewBox="0 0 12 8"
                    aria-hidden="true"
                >
                    <path
                        d="M1 1.5 6 6.5 11 1.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.3"
                    />
                </svg>

            </button>

            <div class="profile-dropdown">

                <div class="dropdown-heading">
                    SWITCH PROFILE
                </div>

                {% for person in profiles %}

                <a
                    href="/?profile={{ person.id }}"
                    class="{% if person.id == profile.id %}current{% endif %}"
                >
                    <span class="dropdown-avatar">
                        {{ person.name[0]|upper }}
                    </span>

                    <span>{{ person.name }}</span>

                    {% if person.id == profile.id %}
                    <span class="current-mark">✓</span>
                    {% endif %}
                </a>

                {% endfor %}

                <a href="/setup" class="new-profile">
                    <span class="new-profile-plus">+</span>
                    New profile
                </a>

            </div>

        </div>

        {% endif %}

    </div>

</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const profileButton = document.querySelector(".profile-button");
    const profileMenu = document.querySelector(".profile-menu");

    if (profileButton && profileMenu) {

        profileButton.addEventListener("click", function (event) {
            event.stopPropagation();
            profileMenu.classList.toggle("open");
        });

        document.addEventListener("click", function () {
            profileMenu.classList.remove("open");
        });

    }

});
</script>

</body>
</html>
